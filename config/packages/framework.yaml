# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Database-backed (not the file-based default) - see services.yaml for why.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        # 2 hours of inactivity, independent of the server's php.ini; "Remember me" covers longer logins
        gc_maxlifetime: 7200
        # Debian/Ubuntu ship gc_probability = 0 and only clean session files by cron, never the database
        gc_probability: 1

    http_client:
        scoped_clients:
            # Packagist (PackagistApiClient): responses are cached and revalidated with
            # If-None-Match / If-Modified-Since, as Packagist asks of regular syncs
            packagist.client:
                scope: 'https://(repo\.)?packagist\.org/'
                caching:
                    enabled: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
