security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api/
            stateless: true
            access_token:
                token_handler: App\Security\SiteAccessTokenHandler
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: dashboard_index
            # Brute force protection for the publicly reachable login (and,
            # once enabled, the two-factor code form): failed attempts per
            # username+IP, plus a global per-IP limit derived from it.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            # optional TOTP 2FA (scheb/2fa), only for users who set it up
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true
            # opt-in via the login form's checkbox; scheb/2fa only sets the cookie once the 2FA code passed
            remember_me:
                lifetime: 2592000 # 30 days
                # changing the password or (re)setting 2FA invalidates existing cookies
                signature_properties: [password, encryptedTotpSecret]
                # tokens in the database (rememberme_token), so logging out deletes this device's
                # token: a request still on its way with the old cookie (e.g. a Turbo prefetch)
                # can't log in again, as a signed cookie stays valid until it expires
                token_provider:
                    doctrine: true
            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* matching rule is applied
    access_control:
        # 2FA rules first: logout must work mid-2FA (to cancel it), the code form only then
        - { path: ^/logout, roles: PUBLIC_ACCESS, requires_channel: https }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS, requires_channel: https }
        - { path: ^/api/, roles: ROLE_SITE, requires_channel: https }
        - { path: ^/login, roles: PUBLIC_ACCESS, requires_channel: https }
        - { path: ^/, roles: ROLE_USER, requires_channel: https }

when@test:
    security:
        firewalls:
            main:
                form_login:
                    # The real login form's CSRF token is a double-submit
                    # cookie set by client-side JS - WebTestCase's client
                    # never runs JS, so it can never produce a token that'd
                    # pass this check. See csrf.yaml for the Form component
                    # (not security firewall) side of the same problem.
                    enable_csrf: false

        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
