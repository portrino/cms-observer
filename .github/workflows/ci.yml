name: CI

on:
  pull_request:
  push:
    # pull requests already run it, so pushes only for main
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests - php${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # a new PHP version runs along without blocking, until its tools and dependencies support it
    continue-on-error: ${{ matrix.experimental }}
    services:
      # the functional tests need a database
      db:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # the test environment appends "_test" to the database name
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/app?serverVersion=11.8.0-MariaDB&charset=utf8mb4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
          extensions: gd
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-scripts --no-progress

      # the pages rendered by the functional tests need the importmap packages and the CSS
      - name: Build assets
        run: composer assets:build

      # PHPStan and Rector read the test container XML (PHPStan types
      # $container->get(Foo::class) in the tests), see build/phpstan.neon
      - name: Warm up the test container cache
        run: php bin/console cache:warmup --env=test

      - name: Run static code analysis
        run: composer ci:static

      - name: Set up the test database
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --env=test -n

      - name: Run tests
        run: composer ci:test
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        experimental: [ false ]
        include:
          - php: '8.6'
            experimental: true

  # the oldest databases the installation docs name; the tests job runs the one DDEV uses
  databases:
    name: tests - ${{ matrix.name }}
    # on main only: a pull request rarely touches what tells databases apart
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health-cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/app?serverVersion=${{ matrix.server-version }}&charset=utf8mb4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: gd
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-scripts --no-progress

      - name: Build assets
        run: composer assets:build

      - name: Set up the test database
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --env=test -n

      - name: Run tests
        run: composer ci:test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MariaDB 10.11
            image: mariadb:10.11
            server-version: 10.11.0-MariaDB
            health-cmd: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8.4
            image: mysql:8.4
            server-version: 8.4.0
            health-cmd: mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
